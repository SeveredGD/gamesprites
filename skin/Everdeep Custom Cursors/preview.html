<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everdeep custom cursors</title><link rel="stylesheet" href="cursors.css?v=2"><style>
body{background:#17191d;color:#dfd2b4;font:16px Georgia,serif;max-width:850px;margin:30px auto;padding:20px}h1{font-weight:400;color:#d3b479}label{display:block;margin:20px 0}select{padding:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}section{min-height:140px;border:1px solid #77664c;background:#24211c;padding:20px}section img{width:48px;height:48px;float:right}section.light{background:#c2b89f;color:#29251e}p{line-height:1.5}output{display:block;margin-top:20px;color:#cfb97e}
</style></head><body class="ed-cursors-48"><h1>Everdeep cursor set · revision 2</h1><p>Move across the tiles to try each cursor. Click a tile to check the hotspot.</p><label>Cursor size <select id="size"><option>32</option><option selected>48</option><option>64</option></select> pixels</label><main id="tiles"></main><output id="status" aria-live="polite"></output><script>
const names=['default','pointer','attack','inspect','blocked','wait'];const labels=['Explore','Interact','Attack','Inspect','Unavailable','Working'];document.getElementById('tiles').innerHTML=names.map((n,i)=>'<section data-cursor="'+n+'"><img src="assets/'+n+'-48.png?v=2" alt=""><h2>'+labels[i]+'</h2><p>'+n+'</p></section>').join('')+'<section class="light"><h2>Light background</h2><p>Check the arrow contrast here.</p></section>';document.getElementById('size').onchange=e=>document.body.className='ed-cursors-'+e.target.value;document.getElementById('tiles').onclick=e=>{const tile=e.target.closest('section');if(tile)document.getElementById('status').textContent='Click registered: '+tile.querySelector('h2').textContent;};
</script></body></html>
