<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everdeep Loading Screens — #1 and #4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="everdeep-loader" class="ed-loader" data-screen="gate" style="--progress:.62">
    <div class="ed-vignette"></div>
    <div class="ed-motes" aria-hidden="true"></div>

    <section class="ed-screen ed-gate" aria-label="The Descent Gate loading screen">
      <header class="ed-title-block">
        <h1>Everdeep</h1>
        <p class="ed-gate-subtitle">Descending Into the Deep</p>
      </header>
      <div class="ed-gate-loader">
        <div class="ed-horizontal-bar" aria-label="Loading progress">
          <img class="ed-track" src="assets/frost-reliquary/track.png" alt="">
          <img class="ed-fill" src="assets/frost-reliquary/fill.png" alt="">
          <img class="ed-bezel" src="assets/frost-reliquary/bezel.png" alt="">
        </div>
        <div class="ed-progress-row"><span class="ed-phase">Descending</span><span class="ed-percent">62%</span></div>
        <p class="ed-lore">The deeper you go, the more the Deep remembers.</p>
      </div>
    </section>

    <section class="ed-screen ed-reliquary" aria-label="The Sealed Reliquary loading screen">
      <h1>Everdeep</h1>
      <svg class="ed-relic-arc" viewBox="0 0 100 100" aria-hidden="true">
        <path class="ed-arc-shadow" d="M 6 50 A 44 44 0 0 0 94 50" pathLength="100"/>
        <path class="ed-arc-rail" d="M 6 50 A 44 44 0 0 0 94 50" pathLength="100"/>
        <path class="ed-arc-fill" d="M 6 50 A 44 44 0 0 0 94 50" pathLength="100"/>
      </svg>
      <div class="ed-reliquary-copy">
        <p class="ed-character">Awakening · The Sorceress</p>
        <p class="ed-relic-percent">62%</p>
      </div>
    </section>
  </main>

  <aside class="ed-devtools" aria-label="Prototype controls">
    <div class="ed-choice"><button data-mode="gate" class="active">#1 Gate</button><button data-mode="reliquary">#4 Reliquary</button></div>
    <label>Progress <input id="progress" type="range" min="0" max="100" value="62"><output>62%</output></label>
    <label class="ed-auto"><input id="autoplay" type="checkbox"> Auto</label>
    <small>Add <code>?clean=1</code> to hide these preview controls.</small>
  </aside>
  <script src="loading-screens.js"></script>
</body>
</html>
