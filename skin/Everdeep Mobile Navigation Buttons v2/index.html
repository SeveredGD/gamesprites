<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everdeep Mobile Navigation v2</title>
<style>
@font-face{font-family:Grenze;src:url('../Everdeep Font Mockups/fonts/Grenze.ttf')}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#28231d,#0c0d10 52%);color:#ddd;font-family:Grenze,serif}.wrap{max-width:760px;margin:auto;padding:28px 16px}h1{font-size:24px;margin:0 0 6px;color:#e8ddc5}p{margin:0 0 18px;color:#999}.phone{width:min(100%,420px);margin:auto;background:#0d0e12;border:1px solid #665d4e;box-shadow:0 16px 55px #000;padding:12px 0 0;min-height:360px;display:flex;align-items:flex-end}.nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;background:#111216;border-top:1px solid #4e493f;padding:3px}.nav button{appearance:none;border:0;background:none;padding:1px;min-width:0;cursor:pointer}.nav img{display:block;width:100%;height:auto;image-rendering:auto}.note{text-align:center;margin-top:14px;color:#918a7d;font-size:13px}
</style>
</head><body><main class="wrap"><h1>Embedded-label mobile navigation</h1><p>Five equal square buttons. Click any button to preview its selected state.</p><div class="phone"><nav class="nav" id="nav"></nav></div><div class="note">At 360px viewport width each button is approximately 70px square.</div></main>
<script>
const names=['combat','runs','gear','skills','more'];let selected='combat';const nav=document.querySelector('#nav');
function render(){nav.replaceChildren(...names.map(name=>{const b=document.createElement('button');b.setAttribute('aria-label',name);const img=document.createElement('img');img.src=`production/128px/nav-${name}${name===selected?'-active':''}.png`;b.append(img);b.onclick=()=>{selected=name;render()};return b}))}render();
</script></body></html>
