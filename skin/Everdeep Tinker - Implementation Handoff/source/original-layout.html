irst-child{color:var(--tk-accent)}#tinker-five .tk-wallet small{margin-left:auto;color:var(--tk-muted);font-size:11px}#tinker-five .tk-tabs{display:flex;padding:14px 20px 0;gap:6px}#tinker-five .tk-tabs button{flex:1;min-height:42px;border:1px solid var(--tk-edge);background:var(--tk-well);color:var(--tk-muted);font-size:14px;display:flex;gap:8px;justify-content:center;align-items:center}#tinker-five .tk-tabs button[aria-pressed=true]{background:var(--tk-panel);color:var(--tk-accent);border-bottom:3px solid var(--tk-accent)}#tinker-five .tk-body{padding:20px}#tinker-five .tk-sectionline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font-size:13px}#tinker-five .tk-sectionline small{font:11px system-ui,sans-serif;color:var(--tk-muted)}#tinker-five .tk-stock{display:grid;grid-template-columns:1fr 1fr;gap:12px}#tinker-five .tk-product{background:var(--tk-panel);border:1px solid var(--tk-edge);padding:19px;min-width:0;display:flex;flex-direction:column}#tinker-five .tk-product:first-child{grid-column:1/-1}#tinker-five .tk-product-head{display:flex;gap:13px;align-items:center;margin-bottom:12px}#tinker-five .tk-art{width:47px;height:47px;border:2px ridge var(--tk-edge);background:var(--tk-well);display:grid;place-items:center;color:var(--tk-accent);flex-shrink:0}#tinker-five .tk-art svg{width:25px;height:25px}#tinker-five h3{font-size:18px;font-weight:400;margin:0 0 5px;line-height:1.2}#tinker-five .tk-sub{font:11px system-ui,sans-serif;color:var(--tk-muted)}#tinker-five .tk-copy{font-size:13px;line-height:1.55;color:var(--tk-muted);margin:0 0 16px}#tinker-five .tk-benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}#tinker-five .tk-benefits span{border-left:2px solid var(--tk-edge);padding-left:10px;font:11px system-ui,sans-serif;color:var(--tk-muted)}#tinker-five .tk-benefits b{display:block;color:var(--tk-ink);font:18px Georgia,serif;margin-bottom:5px}#tinker-five .tk-button{border:2px ridge var(--tk-edge);background:linear-gradient(#ffffff0b,#00000020),var(--tk-well);padding:11px 12px;font-size:13px;min-height:42px}#tinker-five .tk-button.primary{background:var(--tk-accent);color:var(--tk-bg);border-color:var(--tk-accent)}#tinker-five .tk-button:disabled{opacity:.48;cursor:default}#tinker-five .tk-product .tk-button{margin-top:auto;width:100%}#tinker-five .tk-charge{height:5px;background:var(--tk-well);margin:0 0 17px}#tinker-five .tk-charge span{display:block;background:var(--tk-accent);height:100%;width:50%}#tinker-five .tk-limits{background:var(--tk-well);border-left:3px solid var(--tk-accent);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font:12px system-ui,sans-serif;margin-bottom:17px;line-height:1.5}#tinker-five .tk-limits span:last-child{color:var(--tk-muted)}#tinker-five .tk-bench{display:grid;grid-template-columns:1fr 1.12fr;gap:16px}#tinker-five .tk-gear-tabs{display:flex;margin-bottom:9px;gap:5px}#tinker-five .tk-gear-tabs button{flex:1;border:1px solid var(--tk-edge);background:var(--tk-well);padding:8px;font-size:12px;min-height:36px}#tinker-five .tk-gear-tabs button[aria-pressed=true]{color:var(--tk-accent);background:var(--tk-panel)}#tinker-five .tk-item{width:100%;display:flex;align-items:center;gap:10px;padding:12px 9px;border:1px solid var(--tk-edge);background:var(--tk-well);margin-bottom:7px;text-align:left}#tinker-five .tk-item[aria-pressed=true]{background:var(--tk-panel);box-shadow:inset 3px 0 var(--tk-accent)}#tinker-five .tk-item .tk-art{width:33px;height:37px}#tinker-five .tk-item .tk-art svg{width:19px;height:19px}#tinker-five .tk-item strong{font-size:13px;font-weight:400;display:block;line-height:1.4}#tinker-five .tk-item small{display:block;font:11px system-ui,sans-serif;color:var(--tk-muted);margin-top:4px}#tinker-five .tk-work{padding:19px;background:var(--tk-panel);border:1px solid var(--tk-edge);text-align:center}#tinker-five .tk-work>.tk-art{width:65px;height:65px;margin:0 auto 13px;border:3px <div class="tk-options" aria-label="Choose a menu skin"></div><div class="tk-shell"></div>
<script>
(()=>{const root=document.getElementById('tinker-five');const skins=[['forge','01 · Brass & Iron','Brass & Iron','Warm metal · divided workbench'],['ledger','02 · Merchant Ledger','Merchant Ledger','Parchment · annotated order book'],['caravan','03 · Roadside Cart','Roadside Cart','Canvas awning · stocked shelves'],['reliquary','04 · Ashen Reliquary','Ashen Reliquary','Gothic silver · anvil altar'],['field','05 · Expedition Kit','Expedition Kit','Olive canvas · compact service desk']];const state={skin:'forge',page:'shop',source:'equipped',selected:0,gold:428500,essence:18,supplies:7,bought:1,charge:12,used:false,message:'',compact:false};const gear=[{name:"Vanguard’s Edge",icon:'sword',slot:'Weapon',rank:2,stats:[['Damage',340],['Attack speed',62],['Regen / sec',18]]},{name:'Bulwark Vest',icon:'shield',slot:'Armor',rank:1,stats:[['Health',850],['Damage reduction',24],['Regen / sec',12]]},{name:'Band of Vigor',icon:'circle',slot:'Ring',rank:4,stats:[['Attack speed',48],['Health',240],['Regen / sec',16]]}];const vault=[{name:'Tempered Axe',icon:'axe',slot:'Weapon',rank:0,stats:[['Damage',220],['Strength',54],['Life steal',8]]},{name:'Ironbound Greaves',icon:'footprints',slot:'Boots',rank:3,stats:[['Health',320],['Defense',72],['Regen / sec',6]]},{name:'Traveler’s Amulet',icon:'gem',slot:'Amulet',rank:5,stats:[['Health',240],['Strength',38],['Magic find',24]]}];const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';const fmt=n=>n.toLocaleString();const btn=(label,action,disabled=false,primary=false)=>'<button type="button" class="tk-button '+(primary?'primary':'')+'" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+label+'</button>';function render(){const skin=skins.find(s=>s[0]===state.skin);root.dataset.skin=state.skin;root.dataset.compact=state.compact;root.querySelector('.tk-options').innerHTML=skins.map(s=>'<button type="button" data-skin="'+s[0]+'" aria-pressed="'+(s[0]===state.skin)+'">'+s[1]+'</button>').join('');let body='';if(state.page==='shop'){body='<div class="tk-sectionline"><span>Goods & inventions</span><small>Daily stock · sample late-game prices</small></div><div class="tk-stock"><article class="tk-product"><div class="tk-product-head"><span class="tk-art">'+icon('package')+'</span><div><h3>Expedition Supplies</h3><span class="tk-sub">'+state.supplies+' held · '+state.bought+' / 3 bought today</span></div></div><div class="tk-benefits"><span><b>+25%</b>Magic find</span><span><b>+10%</b>Damage</span><span><b>+10%</b>Damage reduction</span><span><b>+25%</b>Mastery XP</span></div><p class="tk-copy">One covered run: up to 5 loops, a delve, or a Bloodpit rite. Live play only.</p>'+btn(state.bought===3?'Sold out today':'Buy supplies · 75,000g','buy',state.bought===3||state.gold<75000,true)+'</article><article class="tk-product"><div class="tk-product-head"><span class="tk-art">'+icon('cog')+'</span><div><h3>The Fortune Mill</h3><span class="tk-sub">Owned · 84 ether drops</span></div></div><p class="tk-copy">'+state.charge+' / 24 hours charged. Grind gems to steer your notable drops.</p><div class="tk-charge"><span style="width:'+state.charge/24*100+'%"></span></div>'+btn(state.charge>=20?'Nearly full':'Charge +4h · 1 essence','charge',state.charge>=20||state.essence<1)+'</article><article class="tk-product"><div class="tk-product-head"><span class="tk-art">'+icon('flask-conical')+'</span><div><h3>Catalyst Chamber</h3><span class="tk-sub">Fitted to the Mill</span></div></div><p class="tk-copy">Combine the right gems to enrich the ether. The mixture lasts until the ether runs out.</p>'+btn('Inspect the Mill','mill')+'</article></div>';}else{const items=state.source==='equipped'?gear:vault;const it=items[state.selected];const pct=[8,5,3,2,1][it.rank]||0;body='<div class="tk-limits"><span>'+(state.used?'This hero has tinkered today':'This hero can tinker today')+'</span><span>'+(state.used?'1':'2')+' / 2 account tinkers left · 1 per hero</span></div><div class="tk-bench"><div><div class="tk-gear-tabs"><button type="button" data-source="equipped" aria-pressed="'+(state.source==='equipped')+'">Equipped</button><button type="button" data-source="vault" aria-pressed="'+(state.source==='vault')+'">Vault</button></div><div class="tk-items">'+items.map((it,i)=>'<button type="button" class="tk-item" data-item="'+i+'" aria-pressed="'+(state.selected===i)+'"><span class="tk-art">'+icon(it.icon)+'</span><span><strong>'+it.name+'</strong><small>'+it.slot+' · '+it.rank+' / 5 '+(it.rank===5?'perfected':'tinkered')+'</small></span></button>').join('')+'</div><p class="tk-note">Equipped tinkering locks its slot. The bonus stays with the item through reforges, enchants, and the bank.</p></div><article class="tk-work"><span class="tk-art">'+icon('anvil')+'</span><h3>'+it.name+'</h3><div class="tk-sub">'+(it.rank===5?'Perfected': 'Tinker '+it.rank+' → '+(it.rank+1)+' · +'+pct+'% to all stats')+'</div><div class="tk-ranks" aria-label="'+it.rank+' of 5 improvements">'+[0,1,2,3,4].map(n=>'<span class="'+(n<it.rank?'done':'')+'"></span>').join('')+'</div><div class="tk-stats">'+it.stats.map(s=>'<div class="tk-stat"><span>'+s[0]+'</span><span>'+s[1]+' <b>→ '+Math.round(s[1]*(1+pct/100))+'</b></span></div>').join('')+'</div>'+btn(it.rank===5?'Perfected · 5 / 5':state.used?'Come back tomorrow':'Improve item · 48,000g','improve',it.rank===5||state.used||state.gold<48000,true)+'</article></div><p class="tk-note">Improvement preview · Sample items and prices. Tinker bonuses follow the existing +8%, +5%, +3%, +2%, +1% ladder.</p>';}
root.querySelector('.tk-shell').innerHTML='<div class="tk-concept"><span>'+skin[2]+'</span><span>Concept '+(skins.indexOf(skin)+1)+' / 5</span></div><header class="tk-head"><span class="tk-emblem">'+icon(state.skin==='ledger'?'notebook-pen':state.skin==='caravan'?'caravan':state.skin==='field'?'backpack':'hammer')+'</span><div><h2>The Traveling Tinker</h2><p class="tk-quote">“Everything sharpens, friend. Even the sharp things.”</p></div></header><div class="tk-wallet"><span>'+icon('coins')+fmt(state.gold)+' gold</span><span>'+icon('sparkles')+state.essence+' essence</span><small>In camp today</small></div><nav class="tk-tabs" aria-label="Tinker services"><button type="button" data-page="shop" aria-pressed="'+(state.page==='shop')+'">'+icon('store')+'Shop & inventions</button><button type="button" data-page="improve" aria-pressed="'+(state.page==='improve')+'">'+icon('anvil')+'Tinker improvements</button></nav><section class="tk-body">'+body+'<div class="tk-message" aria-live="polite">'+state.message+'</div></section><footer class="tk-footer">'+btn('Talk later','later')+btn('Send away','away')+'</footer>';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;state.message='';if(b.dataset.skin){state.skin=b.dataset.skin;}else if(b.dataset.page){state.page=b.dataset.page;}else if(b.dataset.source){state.source=b.dataset.source;state.selected=0;}else if(b.dataset.item!==undefined){state.selected=+b.dataset.item;}else if(b.dataset.action==='buy'&&state.bought<3&&state.gold>=75000){state.gold-=75000;state.bought++;state.supplies++;state.message='Supplies added to your pack. Preview only.';}else if(b.dataset.action==='charge'&&state.charge<20&&state.essence>0){state.essence--;state.charge+=4;state.message='The Mill gains four hours of charge. Preview only.';}else if(b.dataset.action==='improve'&&!state.used){const it=(state.source==='equipped'?gear:vault)[state.selected];if(it.rank<5&&state.gold>=48000){const pct=[8,5,3,2,1][it.rank];it.stats=it.stats.map(s=>[s[0],Math.round(s[1]*(1+pct/100))]);it.rank++;state.gold-=48000;state.used=true;state.message='Improvement complete. One account tinker remains today. Preview only.';}}else if(b.dataset.action==='mill'){state.message='The Fortune Mill opens its own device menu in the game.';}else if(b.dataset.action==='later'){state.message='In the game, this closes the menu and keeps the cart in camp.';}else if(b.dataset.action==='away'){state.message='In the game, this dismisses the Tinker until tomorrow.';}render();});render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'compact',{label:'Hide explanatory shop text'});tweak.addSelect(state,'skin',{label:'Menu skin',options:skins.map(s=>({label:s[2],value:s[0]}))});}
})();
</script>
</div>
