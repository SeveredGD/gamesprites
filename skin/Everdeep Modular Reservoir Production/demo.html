<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Everdeep Modular Sip Reservoir</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#24282a,#08090a 68%);color:#d8c9a6;font-family:Grenze,Georgia,serif}main{width:760px;padding:30px;border:1px solid #3b3b38;background:#080909f5;box-shadow:0 20px 70px #000}h1{margin:0 0 4px;font-size:25px;font-weight:500}.intro{margin:0 0 22px;color:#89918f}.stage{min-height:105px;display:grid;place-items:center;padding:20px;border:1px solid #252927;background:#0c0e0e}.bar{display:flex;align-items:center;filter:drop-shadow(0 3px 4px #000)}.module{width:auto;image-rendering:pixelated}.controls{display:grid;grid-template-columns:120px 120px 1fr auto;align-items:center;gap:14px;margin-top:20px}.controls label{color:#8d9994}.controls input[type=range]{width:100%;accent-color:#30db80}.controls select{color:#d3c7ac;border:1px solid #57554f;background:#111;padding:5px}.controls output{min-width:110px;text-align:right;color:#73e7a7}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.legend div{padding:10px;border:1px solid #252927;background:#0c0e0e;color:#7f8a86;text-align:center}.legend img{display:block;height:32px;width:auto;margin:0 auto 5px;image-rendering:pixelated}
</style>
<main><h1>Modular sip reservoir V4</h1><p class="intro">Original generated glass and liquid, registered to fixed state-0 dimensions.</p><section class="stage"><div class="bar" id="bar"></div></section><div class="controls"><label>Chambers <select id="capacity"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>Height <select id="size"><option>48</option><option>40</option><option selected>32</option><option>28</option><option>24</option><option>20</option><option>16</option></select></label><input id="sips" type="range" min="0" max="8" value="5"><output id="readout">5 / 8 sips</output></div><section class="legend"><div><img src="modular-reservoir-v4-assets/32px/center-0.png">0 empty</div><div><img src="modular-reservoir-v4-assets/32px/center-1.png">1 half</div><div><img src="modular-reservoir-v4-assets/32px/center-2.png">2 full</div></section></main>
<script>
const bar=document.querySelector('#bar'),capacity=document.querySelector('#capacity'),size=document.querySelector('#size'),sips=document.querySelector('#sips'),readout=document.querySelector('#readout');
function render(){const n=Number(capacity.value),px=Number(size.value),total=Number(sips.value),max=n*2;sips.max=max;if(total>max)sips.value=max;const safe=Number(sips.value);bar.innerHTML=Array.from({length:n},(_,i)=>{const part=i===0?'left':i===n-1?'right':'center',state=Math.max(0,Math.min(2,safe-i*2));return `<img class="module" style="height:${px}px" src="modular-reservoir-v4-assets/${px}px/${part}-${state}.png" alt="${part} chamber state ${state}">`}).join('');readout.value=`${safe} / ${max} sips`}
capacity.onchange=render;size.onchange=render;sips.oninput=render;render();
</script>
</html>
