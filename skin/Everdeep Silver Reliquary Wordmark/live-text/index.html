<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Reliquary — Live Text</title><link rel="stylesheet" href="silver-reliquary.css"><script defer src="silver-reliquary.js"></script><style>body{margin:0;padding:30px;background:#101416;color:#c4cbcc;font:16px system-ui}main{max-width:1000px;margin:auto}label{display:block;margin:20px 0}textarea{display:block;width:100%;box-sizing:border-box;background:#202629;color:#eee;padding:12px;font:20px Georgia;border:1px solid #59656a}.stage{text-align:center;padding:50px 24px;border:1px solid #414a4e;margin:30px 0;min-height:180px}.stage h1{margin:0;max-width:100%;--silver-size:clamp(30px,8vw,100px)}.samples{display:flex;gap:32px;flex-wrap:wrap;align-items:center}.samples button{background:#181e21;border:1px solid #748088;padding:16px 24px}.samples .silver-reliquary{--silver-size:28px}input{accent-color:#9db3bd}code{color:#eee}</style><main><h2>Silver Reliquary · reusable text</h2><p>Type any title. These are live font glyphs with CSS styling, not images.</p><label>Text<textarea id="words" rows="2">EVERDEEP
IDLE</textarea></label><label>Size <input id="size" type="range" min="24" max="120" value="100"> <output id="value">100px</output></label><div class="stage"><h1 id="sample" class="silver-reliquary">EVERDEEP
IDLE</h1></div><div class="samples"><span class="silver-reliquary">LOADOUTS</span><span class="silver-reliquary">RESEARCH</span><button><span class="silver-reliquary">Equip</span></button></div><p>Preserves the original font and palette. The original bitmap's scratches and pixel bevel are not reproduced exactly.</p><script>document.querySelector('#words').oninput=e=>SilverReliquary.setText(document.querySelector('#sample'),e.target.value);document.querySelector('#size').oninput=e=>{document.querySelector('#sample').style.setProperty('--silver-size',e.target.value+'px');document.querySelector('#value').value=e.target.value+'px'};</script></main></html>
