<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everdeep Character Select Layout Mockups</title>
<style>
  :root{--ink:#08090c;--panel:#101116;--panel2:#15161b;--line:#565a61;--silver:#c7c9cb;--muted:#8f9097;--gold:#d2ad56;--green:#78c388;--danger:#b66f68;--accent:#c8a0ff;--zoom:1}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#050609;color:#ddd;font-family:Georgia,'Times New Roman',serif}
  body{background:radial-gradient(ellipse at 50% -10%,#202632 0,#0b0d12 38%,#030405 80%);letter-spacing:.02em}
  button{font:inherit;color:inherit}.tool{min-height:100vh;display:flex;flex-direction:column}
  .toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 14px;background:#090a0eea;border-bottom:1px solid #343841;box-shadow:0 5px 20px #000}
  .toolbar strong{color:#e7d7b0;letter-spacing:.12em;margin-right:10px;font-size:13px}.toolbar .spacer{flex:1}.toolbtn{cursor:pointer;background:#15171d;border:1px solid #555a63;padding:7px 12px;min-height:34px}.toolbtn:hover,.toolbtn.on{border-color:#d3d6da;color:#fff;background:#24272e}.toolbtn.on{box-shadow:inset 0 -2px var(--gold)}
  .stage-wrap{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}.stage{width:min(1180px,100%);min-height:720px;position:relative;overflow:hidden;transform-origin:top center;background:linear-gradient(135deg,#0b0c10,#050608 60%,#0b0c10);box-shadow:0 24px 70px #000;border:22px solid transparent;border-image:url('assets/frame-fleur-subtle.png') 110 fill / 22px stretch}
  .stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 28%,#29354940,transparent 32%),linear-gradient(90deg,transparent 49.8%,#9b825814 50%,transparent 50.2%);mix-blend-mode:screen}
  .header{position:relative;text-align:center;padding:20px 24px 12px;border-bottom:1px solid #4b4d5466}.game-title{font-size:28px;color:#e4e5e4;letter-spacing:.2em;text-shadow:0 2px 0 #000,0 0 16px #a9bbc844}.subtitle{color:#8d8f98;font-size:13px;letter-spacing:.16em;margin-top:6px;text-transform:uppercase}
  .screen{position:relative;padding:20px 24px 24px}.silver-panel{background:linear-gradient(145deg,#17181d,#0c0d11 70%);border:13px solid transparent;border-image:url('assets/frame-crown-subtle.png') 95 fill / 13px stretch}
  .portrait{background-image:url('assets/class-select-icons.png');background-repeat:no-repeat;background-size:200% 200%;image-rendering:auto;filter:drop-shadow(0 8px 8px #000)}
  .sorceress{background-position:0 0}.ranger{background-position:100% 0}.warrior{background-position:0 100%}.rogue{background-position:100% 100%}
  .class-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.class-tab{position:relative;cursor:pointer;min-height:92px;padding:8px 8px 8px 86px;text-align:left;background:#0d0e12;border:8px solid transparent;border-image:url('assets/button-quiet-diamond.png') 33 180 33 180 fill / 8px 18px stretch;filter:brightness(.62) saturate(.75);transition:.15s}.class-tab:hover{filter:brightness(.86)}.class-tab.on{filter:none;box-shadow:0 0 22px #b4c9d722}.class-tab .portrait{position:absolute;width:70px;height:70px;left:10px;top:6px}.class-name{font-size:17px;color:var(--class);margin:13px 0 4px}.class-meta{font-size:11px;color:#858791;line-height:1.35}.count{position:absolute;right:8px;top:6px;font-size:10px;color:#858791}
  .label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#777b83}.value{color:#e2d8c1}.badge{display:inline-block;font-size:10px;padding:2px 6px;border:1px solid #646973;color:#bcc0c6;margin-right:5px;text-transform:uppercase}.badge.green{border-color:#447652;color:#7bc38a}.badge.purple{border-color:#744e86;color:#c680e3}
  .primary,.secondary,.danger{cursor:pointer;border:9px solid transparent;min-height:46px;padding:2px 20px;text-transform:uppercase;letter-spacing:.09em;background:transparent}.primary{border-image:url('assets/button-quiet-diamond.png') 33 180 33 180 fill / 9px 22px stretch;color:#ead99a}.secondary,.danger{border-image:url('assets/button-chain-bracket.png') 66 180 fill / 9px 23px stretch;color:#c7c9cb}.danger{color:#c88278}.primary:hover,.secondary:hover,.danger:hover{filter:brightness(1.2)}
  .footerline{display:flex;justify-content:center;gap:20px;color:#70737c;font-size:11px;padding-top:15px}.footerline a{cursor:pointer;color:#8e929c}

  /* Concept one */
  .focus-grid{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(470px,1.45fr);gap:18px;margin-top:16px}.hero-focus{position:relative;min-height:435px;padding:18px;text-align:center}.hero-focus .big{width:250px;height:250px;margin:-4px auto -8px}.hero-focus h2{margin:0;color:var(--accent);font-size:26px;letter-spacing:.08em}.hero-focus .meta{color:#a7a9b0;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-top:4px}.hero-focus p{max-width:360px;margin:14px auto;color:#a7a193;font-size:13px;line-height:1.55}.identity{display:flex;justify-content:center;gap:8px}.roster{padding:16px 17px}.roster-head{display:flex;align-items:end;border-bottom:1px solid #4a4d54;padding:2px 2px 10px;margin-bottom:10px}.roster-head h3{margin:0;color:#d7d8da;font-size:17px;letter-spacing:.1em}.roster-head span{margin-left:auto;color:#737780;font-size:11px}.save-card{display:grid;grid-template-columns:1fr 160px 100px;align-items:center;gap:13px;padding:13px 14px;margin:9px 0;background:linear-gradient(90deg,#17191f,#0c0d11);border:1px solid #3d4149;cursor:pointer;position:relative}.save-card:hover,.save-card.on{border-color:#aeb3bb}.save-card.on:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:var(--accent);box-shadow:0 0 9px var(--accent)}.save-name{font-size:18px;color:#ded5c0}.save-sub{font-size:11px;color:#81848d;margin-top:4px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}.facts b{display:block;color:#d6cba9;font-size:14px;margin-top:3px}.small-play{font-size:11px;padding:7px 8px;border:1px solid #565b64;background:#111319;color:#c9cdd2}.empty{opacity:.65;border-style:dashed}.empty .save-name{font-size:14px;color:#979aa2}.continuebar{display:flex;gap:8px;align-items:center;margin-top:14px}.continuebar .primary{flex:1}.manage{margin-top:8px;text-align:right}.manage button{border:0;background:none;color:#737780;font-size:11px;cursor:pointer;margin-left:12px}.manage button:hover{color:#c5c7cb}

  /* Concept two */
  .gallery-intro{text-align:center;color:#92959d;font-size:12px;margin:3px 0 16px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.hero-door{cursor:pointer;min-height:360px;text-align:center;padding:14px 12px;position:relative;overflow:hidden;background:linear-gradient(#15171d,#08090c);border:14px solid transparent;border-image:url('assets/frame-crown-subtle.png') 95 fill / 14px stretch;filter:brightness(.62);transition:.2s}.hero-door:hover{filter:brightness(.82);transform:translateY(-2px)}.hero-door.on{filter:none}.hero-door.on:after{content:"";position:absolute;inset:7px;border:1px solid var(--class);opacity:.35;pointer-events:none}.hero-door .portrait{width:175px;height:175px;margin:12px auto 2px}.hero-door h2{font-size:19px;color:var(--class);margin:4px 0}.hero-door p{font-size:11px;line-height:1.45;color:#989991;min-height:48px}.hero-door .slot-markers{display:flex;justify-content:center;gap:6px;margin:14px 0}.slot-markers i{width:7px;height:7px;background:#343740;border-radius:50%}.slot-markers i.f{background:var(--class);box-shadow:0 0 6px var(--class)}.door-action{font-size:11px;color:#c9c3b6;border-top:1px solid #353841;padding-top:11px}.drawer{margin-top:14px;padding:12px 15px;display:flex;align-items:center;gap:15px}.drawer .who{min-width:240px}.drawer .who strong{font-size:18px;color:#e0d6c1}.drawer .who small{display:block;color:#81848c;margin-top:3px}.drawer .progress{display:flex;gap:24px;flex:1}.drawer .progress b{display:block;color:#d7cba4;margin-top:4px}.drawer .primary{min-width:190px}

  /* Concept three */
  .ledger{display:grid;grid-template-columns:220px 1fr;gap:14px;min-height:545px}.rail{padding:12px}.rail-title{font-size:11px;color:#787c85;text-transform:uppercase;letter-spacing:.16em;padding:6px 8px 11px}.rail-class{cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:7px;border:1px solid transparent;background:#101116;filter:brightness(.65)}.rail-class:hover{filter:brightness(.85)}.rail-class.on{filter:none;border-color:#6d717a}.rail-class .portrait{width:58px;height:58px;flex:none}.rail-class b{color:var(--class);font-size:15px}.rail-class small{display:block;color:#747780;margin-top:3px}.ledger-main{padding:18px}.ledger-top{display:grid;grid-template-columns:125px 1fr auto;gap:15px;align-items:center;border-bottom:1px solid #444850;padding-bottom:14px}.ledger-top .portrait{width:120px;height:120px}.ledger-top h2{font-size:24px;color:#ded4be;margin:0 0 5px}.ledger-top p{font-size:12px;color:#8d9097;margin:0;line-height:1.45;max-width:440px}.ledger-top .primary{min-width:155px}.ledger-rows{margin-top:13px}.ledger-row{display:grid;grid-template-columns:44px 1.15fr .8fr .8fr 90px;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid #2f3239;cursor:pointer}.ledger-row:hover,.ledger-row.on{background:#1a1c22}.ledger-row.on{box-shadow:inset 3px 0 var(--accent)}.num{width:30px;height:30px;display:grid;place-items:center;border:1px solid #50545c;color:#8f9299}.ledger-name{font-size:16px;color:#ddd3bd}.ledger-row small{display:block;color:#767982;margin-top:2px}.ledger-cell .label{display:block}.ledger-cell b{color:#d7caa1;font-size:13px}.rowplay{background:#15181e;border:1px solid #5d626b;padding:7px;cursor:pointer;font-size:11px}.ledger-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#777b84;font-size:11px}.ledger-actions button{background:none;border:0;color:#888c95;cursor:pointer}.cloud{color:#6fa77c}
  .mobile-note{display:none}
  .stage.mobile{width:390px;min-height:790px;border-width:12px}.stage.mobile .header{padding:13px 10px 9px}.stage.mobile .game-title{font-size:19px}.stage.mobile .subtitle{font-size:9px}.stage.mobile .screen{padding:10px}.stage.mobile .class-tabs{grid-template-columns:repeat(4,1fr);gap:4px}.stage.mobile .class-tab{min-height:78px;padding:58px 2px 4px;text-align:center;border-width:5px}.stage.mobile .class-tab .portrait{width:54px;height:54px;left:50%;top:2px;transform:translateX(-50%)}.stage.mobile .class-tab .class-name{font-size:10px;margin:0}.stage.mobile .class-tab .class-meta,.stage.mobile .class-tab .count{display:none}.stage.mobile .focus-grid{grid-template-columns:1fr;gap:8px;margin-top:8px}.stage.mobile .hero-focus{min-height:auto;padding:8px;display:grid;grid-template-columns:102px 1fr;text-align:left;align-items:center}.stage.mobile .hero-focus .big{width:98px;height:98px;margin:0}.stage.mobile .hero-copy h2{font-size:19px}.stage.mobile .hero-focus p{font-size:10px;line-height:1.35;margin:6px 0}.stage.mobile .hero-focus .meta{font-size:9px}.stage.mobile .identity{justify-content:flex-start}.stage.mobile .roster{padding:10px}.stage.mobile .save-card{grid-template-columns:1fr auto;padding:10px;margin:6px 0}.stage.mobile .save-card .facts{display:none}.stage.mobile .save-name{font-size:15px}.stage.mobile .continuebar{position:sticky;bottom:0;background:#0b0c10;padding-top:7px}.stage.mobile .continuebar .secondary{display:none}.stage.mobile .footerline{padding-top:8px}.stage.mobile .gallery{grid-template-columns:1fr 1fr;gap:6px}.stage.mobile .gallery-intro{display:none}.stage.mobile .hero-door{min-height:220px;padding:6px;border-width:8px}.stage.mobile .hero-door .portrait{width:110px;height:110px;margin:0 auto}.stage.mobile .hero-door h2{font-size:14px}.stage.mobile .hero-door p{font-size:9px;min-height:38px;margin:4px}.stage.mobile .drawer{display:block;padding:10px}.stage.mobile .drawer .who{min-width:0;margin-bottom:8px}.stage.mobile .drawer .progress{display:none}.stage.mobile .drawer .primary{width:100%}.stage.mobile .ledger{grid-template-columns:1fr;gap:7px;min-height:0}.stage.mobile .rail{display:grid;grid-template-columns:repeat(4,1fr);padding:5px;gap:4px}.stage.mobile .rail-title{display:none}.stage.mobile .rail-class{display:block;text-align:center;padding:3px;margin:0}.stage.mobile .rail-class .portrait{width:53px;height:53px;margin:auto}.stage.mobile .rail-class b{font-size:9px}.stage.mobile .rail-class small{display:none}.stage.mobile .ledger-main{padding:9px}.stage.mobile .ledger-top{grid-template-columns:74px 1fr;gap:8px}.stage.mobile .ledger-top .portrait{width:70px;height:70px}.stage.mobile .ledger-top h2{font-size:17px}.stage.mobile .ledger-top p{font-size:9px}.stage.mobile .ledger-top .primary{grid-column:1/-1;width:100%}.stage.mobile .ledger-row{grid-template-columns:31px 1fr 64px;padding:9px 5px}.stage.mobile .ledger-row .ledger-cell{display:none}.stage.mobile .ledger-row .num{width:27px;height:27px}.stage.mobile .ledger-actions{flex-wrap:wrap;gap:8px}.stage.mobile .mobile-note{display:block;text-align:center;color:#777;font-size:10px;margin-top:6px}
  .cloud.off{color:#878078}.cloud.off a{color:#c7b98f;text-decoration:underline;text-underline-offset:3px}
  .cloud.off{color:#878078}.cloud.off a{color:#c7b98f;text-decoration:underline;text-underline-offset:3px}
  .lang-select{min-width:112px;padding:3px 24px 3px 8px;border:1px solid #454952;background:#0b0c11;color:#c9bd98;font:11px Georgia,'Times New Roman',serif;cursor:pointer}
  .lang-globe{font-size:16px;line-height:1;filter:grayscale(1) sepia(.25);opacity:.9}
  .focus-grid .continuebar .secondary{display:none}
  body.cloud-off .identity .badge.green,body.cloud-off .footerline .cloud,body.cloud-off .ledger-actions .cloud{display:none}
  body.cloud-off .footerline:before,body.cloud-off .ledger-actions:before{content:"Cloud sync is not linked · Link cloud sync";color:#b7a879;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  /* Hero Focus: use the same class art as the equipment paper doll, rendered as a silhouette. */
  .hero-focus .portrait.big{position:relative;z-index:1;width:100%;height:250px;margin:-2px auto -8px;background-repeat:no-repeat;background-position:center;filter:brightness(0) opacity(.9) drop-shadow(0 0 1px #d0b971aa) drop-shadow(0 0 13px #a8883f38)}
  .hero-focus:before{content:"";position:absolute;z-index:0;left:50%;top:184px;width:330px;height:94px;transform:translateX(-50%);background-position:center;background-repeat:no-repeat;background-size:contain;filter:drop-shadow(0 7px 10px #000a)}
  .hero-focus:has(.portrait.big.sorceress):before{background-image:url('assets/platform-sorceress-transparent.png')}
  .hero-focus:has(.portrait.big.ranger):before{background-image:url('assets/platform-ranger-transparent.png')}
  .hero-focus:has(.portrait.big.warrior):before{background-image:url('assets/platform-warrior-transparent.png')}
  .hero-focus:has(.portrait.big.rogue):before{background-image:url('assets/platform-rogue-transparent.png')}
  .hero-focus .portrait.big.sorceress{background-image:url('assets/hero-sorceress.png');background-size:auto 225px;background-position:center calc(50% - 9px)}
  .hero-focus .portrait.big.warrior{background-image:url('assets/hero-warrior.png');background-size:auto 202px;background-position:center calc(50% - 9px)}
  .hero-focus .portrait.big.rogue{background-image:url('assets/hero-rogue.png');background-size:auto 213px;background-position:center calc(50% - 9px)}
  .hero-focus .portrait.big.ranger{background-image:url('assets/hero-ranger.png');background-size:auto 530px;background-position:calc(50% - 33px) calc(50% - 9px)}
  .stage.mobile .hero-focus:before{top:70px;width:130px;height:48px;left:58px}
  .stage.mobile .hero-focus .portrait.big{width:108px;height:120px;margin:0}
  .stage.mobile .hero-focus .portrait.big.sorceress{background-size:auto 108px}
  .stage.mobile .hero-focus .portrait.big.warrior{background-size:auto 97px}
  .stage.mobile .hero-focus .portrait.big.rogue{background-size:auto 102px}
  .stage.mobile .hero-focus .portrait.big.sorceress{background-position:center calc(50% - 4px)}
  .stage.mobile .hero-focus .portrait.big.warrior{background-position:center calc(50% - 4px)}
  .stage.mobile .hero-focus .portrait.big.rogue{background-position:center calc(50% - 4px)}
  .stage.mobile .hero-focus .portrait.big.ranger{background-size:auto 254px;background-position:calc(50% - 16px) calc(50% - 4px)}
  @media(max-width:760px){.toolbar strong{display:none}.toolbar{flex-wrap:wrap}.stage-wrap{padding:8px}.stage:not(.mobile){min-width:920px}}
</style>
</head>
<body class="cloud-off">
<div class="tool">
  <div class="toolbar">
    <strong>CHARACTER SELECT MOCKUPS</strong>
    <button class="toolbtn on" data-layout="focus">1 Hero Focus</button>
    <button class="toolbtn" data-layout="gallery">2 Class Gallery</button>
    <button class="toolbtn" data-layout="ledger">3 Roster Ledger</button>
    <span class="spacer"></span>
    <button class="toolbtn on" data-device="desktop">Desktop</button>
    <button class="toolbtn" data-device="mobile">Phone</button>
    <button class="toolbtn" data-cloud="on">Cloud On</button>
    <button class="toolbtn on" data-cloud="off">Cloud Off</button>
  </div>
  <div class="stage-wrap"><main class="stage" id="stage"></main></div>
</div>
<script>
const classes=[
 {key:'sorceress',name:'Sorceress',meta:'80 HP · Spell caster',color:'#c8a0ff',short:'Fire, frost, and lightning with reliable passive spell procs.'},
 {key:'ranger',name:'Ranger',meta:'100 HP · Hunter, Archer, Trapper',color:'#7aaa5a',short:'Three distinct specs, animal companions, and bounty-hunt rewards.'},
 {key:'warrior',name:'Warrior',meta:'130 HP · Melee specialist',color:'#c87a3a',short:'Build Rage, spend it on techniques, and gear around each attack.'},
 {key:'rogue',name:'Rogue',meta:'90 HP · Assassin, Toxicologist, Mage hunter',color:'#c85a5a',short:'Critical strikes, damage over time, spell disruption, and schemes.'}
];
const saves={sorceress:[['Mira','82','12,480','Everdeep','Epoch'],['Ashen','46','5,770','Hell · A4','SSF']],ranger:[['Vale','71','9,140','Deso · A2',''],['Thorn','33','2,805','Nightmare · A5','']],warrior:[['Rook','94','18,320','Everdeep','SSF'],['Garran','57','7,610','Hell · A5','']],rogue:[['Nox','76','10,905','Deso · A4',''],['Vesper','29','1,960','Nightmare · A3','Epoch']]};
let active='sorceress',selected=0,layout='focus',device='desktop',cloudEnabled=false;
function c(){return classes.find(x=>x.key===active)}
function tabs(){return `<div class="class-tabs">${classes.map(x=>`<button class="class-tab ${x.key===active?'on':''}" data-class="${x.key}" style="--class:${x.color}"><span class="count">2 / 3</span><span class="portrait ${x.key}"></span><div class="class-name">${x.name}</div><div class="class-meta">${x.meta}</div></button>`).join('')}</div>`}
function badges(tag){return `<span class="badge ${tag==='SSF'?'green':tag==='Epoch'?'purple':''}">${tag||'Standard'}</span>`}
function cloudStatus(){return cloudEnabled?'<span class="cloud">Cloud sync enabled</span>':'<span class="cloud off">Cloud sync is not linked · <a>Link cloud sync</a></span>'}
function header(){return `<header class="header"><div class="game-title">EVERDEEP IDLE</div><div class="subtitle">Choose a hero to continue</div></header>`}
function focus(){let x=c(),ss=saves[active];return `${header()}<section class="screen" style="--accent:${x.color}">${tabs()}<div class="focus-grid"><div class="hero-focus silver-panel"><div class="portrait big ${x.key}"></div><div class="hero-copy"><h2>${x.name}</h2><div class="meta">${x.meta}</div><p>${x.short}</p><div class="identity"><span class="badge">3 save slots</span><span class="badge green">Cloud ready</span></div></div></div><div class="roster silver-panel"><div class="roster-head"><h3>Your ${x.name} characters</h3><span>2 of 3 slots used</span></div>${ss.map((s,i)=>`<div class="save-card ${i===selected?'on':''}" data-save="${i}"><div><div class="save-name">${s[0]}</div><div class="save-sub">Level ${s[1]} ${x.name} &nbsp; ${badges(s[4])}</div></div><div class="facts"><div><span class="label">Gear</span><b>${s[2]}</b></div><div><span class="label">Furthest</span><b>${s[3]}</b></div></div><button class="small-play">Select</button></div>`).join('')}<div class="save-card empty"><div><div class="save-name">Create a new ${x.name}</div><div class="save-sub">Start a fresh run</div></div><div></div><button class="small-play">New run</button></div><div class="continuebar"><button class="secondary">New character</button><button class="primary">Continue as ${ss[selected][0]}</button></div><div class="manage"><button>Rename</button><button>Reorder</button><button>Delete</button></div></div></div><div class="footerline"><span class="cloud">Cloud sync enabled</span><a>Settings</a><a>Change skin</a></div></section>`}
function gallery(){let x=c(),s=saves[active][selected];return `${header()}<section class="screen" style="--accent:${x.color}"><div class="gallery-intro">Pick a class first. Your most recent character is ready below.</div><div class="gallery">${classes.map(y=>`<article class="hero-door ${y.key===active?'on':''}" data-class="${y.key}" style="--class:${y.color}"><div class="portrait ${y.key}"></div><h2>${y.name}</h2><p>${y.short}</p><div class="slot-markers"><i class="f"></i><i class="f"></i><i></i></div><div class="door-action">${y.key===active?'Selected · View roster':'2 characters'}</div></article>`).join('')}</div><div class="drawer silver-panel"><div class="who"><strong>${s[0]}</strong><small>Level ${s[1]} ${x.name} · ${s[4]||'Standard'}</small></div><div class="progress"><div><span class="label">Gear score</span><b>${s[2]}</b></div><div><span class="label">Furthest</span><b>${s[3]}</b></div></div><button class="secondary">Other saves</button><button class="primary">Continue</button></div><div class="footerline"><span class="cloud">Cloud sync enabled</span><a>Character manager</a><a>Settings</a></div></section>`}
function ledger(){let x=c(),ss=saves[active];return `${header()}<section class="screen" style="--accent:${x.color}"><div class="ledger"><aside class="rail silver-panel"><div class="rail-title">Classes</div>${classes.map(y=>`<div class="rail-class ${y.key===active?'on':''}" data-class="${y.key}" style="--class:${y.color}"><span class="portrait ${y.key}"></span><div><b>${y.name}</b><small>2 of 3 used</small></div></div>`).join('')}</aside><div class="ledger-main silver-panel"><div class="ledger-top"><div class="portrait ${x.key}"></div><div><h2>${x.name} roster</h2><p>${x.short}</p></div><button class="primary">New ${x.name}</button></div><div class="ledger-rows">${ss.map((s,i)=>`<div class="ledger-row ${i===selected?'on':''}" data-save="${i}"><div class="num">${i+1}</div><div class="ledger-name">${s[0]}<small>Level ${s[1]} · ${s[4]||'Standard'}</small></div><div class="ledger-cell"><span class="label">Gear</span><b>${s[2]}</b></div><div class="ledger-cell"><span class="label">Furthest</span><b>${s[3]}</b></div><button class="rowplay">Play</button></div>`).join('')}<div class="ledger-row"><div class="num">3</div><div class="ledger-name" style="color:#7f828a">Empty slot<small>Start a new run</small></div><div class="ledger-cell"></div><div class="ledger-cell"></div><button class="rowplay">Create</button></div></div><div class="ledger-actions"><span class="cloud">Cloud sync enabled</span><span><button>Rename selected</button><button>Move</button><button>Delete</button></span></div></div></div><div class="mobile-note">On phone, class selection becomes a four-icon rail and the roster stays one-tap.</div></section>`}
function render(){let el=document.getElementById('stage');el.className='stage '+(device==='mobile'?'mobile':'');el.innerHTML=layout==='gallery'?gallery():layout==='ledger'?ledger():focus();document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{active=b.dataset.class;selected=0;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{selected=+b.dataset.save;render()})}
const _renderLayout=render;
render=function(){_renderLayout();document.querySelectorAll('.footerline a').forEach(a=>{if(a.textContent.trim()==='Change skin')a.outerHTML='<label class="label" style="display:flex;align-items:center;gap:6px"><span class="lang-globe" aria-hidden="true">🌐</span><select class="lang-select" aria-label="Language"><option>English</option><option>Español</option><option>Русский</option><option>中文</option></select></label>'})}
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('on',x===b));render()});render();
document.querySelectorAll('[data-cloud]').forEach(b=>b.onclick=()=>{cloudEnabled=b.dataset.cloud==='on';document.body.classList.toggle('cloud-off',!cloudEnabled);document.querySelectorAll('[data-cloud]').forEach(x=>x.classList.toggle('on',x===b));render()});
</script>
</body>
</html>
