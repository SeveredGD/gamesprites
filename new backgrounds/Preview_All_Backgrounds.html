<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everdeep New Backgrounds</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #080b10; color: #d8e0e8; font: 15px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 20px; color: #8fa0b2; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 10px; background: #111720; border: 1px solid #2a3542; border-radius: 8px; }
    img { display: block; width: 100%; object-fit: cover; image-rendering: pixelated; background: #000; }
    .act img { aspect-ratio: 455 / 256; }
    .delve img { aspect-ratio: 2 / 1; }
    figcaption { padding-top: 8px; color: #b9c7d5; }
    small { color: #7f91a3; }
  </style>
</head>
<body>
  <h1>Everdeep new backgrounds</h1>
  <p>Six-second seamless previews. The matching game atlases and JSON files sit beside each preview.</p>
  <main>
    <figure class="act"><img src="acts/act_1_drowned_grave_road-loop-preview.webp" alt="Act 1"><figcaption>Act 1 — fog and swamp motes</figcaption></figure>
    <figure class="act"><img src="acts/act_2_necropolis_causeway-loop-preview.webp" alt="Act 2"><figcaption>Act 2 — sweeping desert sand</figcaption></figure>
    <figure class="act"><img src="acts/act_3_ritual_crossing-loop-preview.webp" alt="Act 3"><figcaption>Act 3 — mist and violet ambience</figcaption></figure>
    <figure class="act"><img src="acts/act_4_celestial_transit_hall-loop-preview.webp" alt="Act 4"><figcaption>Act 4 — blinking rune groups</figcaption></figure>
    <figure class="act"><img src="acts/act_5_frost_gate_terrace-loop-preview.webp" alt="Act 5"><figcaption>Act 5 — wind-driven snow</figcaption></figure>
    <figure class="delve"><img src="delves/delve_bg_1-pixel-v1-loop-preview.webp" alt="Delve 1"><figcaption>Delve 1 — cavern mist, cyan pulse, and water glints</figcaption></figure>
    <figure class="delve"><img src="delves/delve_bg_2-pixel-v1-loop-preview.webp" alt="Delve 2"><figcaption>Delve 2 — chasm haze, crystal glow, and lantern flicker</figcaption></figure>
  </main>
</body>
</html>
